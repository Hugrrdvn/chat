<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تسجيل الدخول - كلاسيك الملكي</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
}

body { 
    background-image: url('https://i.ibb.co/fVgM9d4V/1794133679969-2.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex; 
    flex-direction: column;
    align-items: center; 
    justify-content: center;
    position: relative;
}

/* إضاءة خلفية ناعمة لتبدو كفخامة الرخام الأسود */
body::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(10,10,10,0.85) 100%);
    z-index: 1;
    pointer-events: none;
}

/* الإطار الملكي الخارجي المزدوج */
body::before {
    content: '';
    position: absolute;
    top: 12px; bottom: 12px; left: 12px; right: 12px;
    border: 2px solid #d4af37;
    pointer-events: none;
    z-index: 3;
    box-shadow: inset 0 0 35px rgba(212, 175, 55, 0.45), 0 0 25px rgba(0, 0, 0, 0.95);
    border-radius: 20px;
}

.inner-frame {
    position: absolute;
    top: 20px; bottom: 20px; left: 20px; right: 20px;
    border: 1.5px solid rgba(212, 175, 55, 0.65);
    pointer-events: none;
    z-index: 3;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    border-radius: 14px;
}

/* نجوم لامعة خلفية */
.sparkle {
    position: absolute;
    background: #ffd700;
    border-radius: 50%;
    animation: twinkle 2.2s infinite ease-in-out;
    z-index: 2;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.6); }
    50% { opacity: 1; transform: scale(1.4); box-shadow: 0 0 15px #ffd700; }
}

/* بطاقة تسجيل الدخول الفاخرة */
.login-card {
    width: 90%;
    max-width: 360px;
    background: rgba(12, 12, 12, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 2.5px solid #d4af37;
    border-radius: 28px;
    padding: 32px 22px 35px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.95), 0 0 40px rgba(212, 175, 55, 0.4);
    z-index: 10;
}

.crown-top {
    font-size: 38px;
    color: #ffd700;
    margin-bottom: 2px;
    filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.9));
    animation: floatCrown 3s ease-in-out infinite;
}

@keyframes floatCrown {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.marquee-box {
    width: 98%;
    max-width: 330px;
    background: rgba(0, 0, 0, 0.5);
    border: 1.5px solid #d4af37;
    border-radius: 16px;
    padding: 8px 12px;
    margin-bottom: 12px;
    overflow: hidden;
    white-space: nowrap;
    box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.4), 0 0 10px rgba(0, 0, 0, 0.8);
}

.moving-text {
    display: inline-block;
    color: #ffd700;
    font-size: 17px;
    font-weight: 900;
    text-shadow: 0 1px 5px rgba(0,0,0,0.95);
    letter-spacing: 1px;
    animation: moveLeftToRight 12s linear infinite;
}

@keyframes moveLeftToRight {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

.avatar-preview {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    border: 3px solid #ffd700;
    background: linear-gradient(135deg, #4a3b0c, #1f1804);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.8), inset 0 0 10px rgba(255, 215, 0, 0.4);
    overflow: hidden;
    margin-bottom: 8px;
}

.avatar-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

.avatar-btn {
    background: linear-gradient(135deg, rgba(30,30,30,0.9), rgba(15,15,15,0.9));
    border: 1.5px solid #d4af37;
    color: #ffd700;
    padding: 7px 15px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    transition: 0.3s;
}

.login-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.input-group {
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
}

.input-icon {
    position: absolute;
    right: 16px;
    color: #d4af37;
    font-size: 16px;
}

.login-input {
    width: 100%;
    background: rgba(10, 10, 10, 0.85);
    border: 1.5px solid rgba(212, 175, 55, 0.65);
    border-radius: 16px;
    padding: 16px 48px 16px 16px;
    color: #ffffff;
    font-size: 16px;
    outline: none;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
}

.login-input:focus {
    border-color: #ffd700;
    background: rgba(20, 20, 20, 0.95);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
}

.login-btn {
    width: 100%;
    background: linear-gradient(135deg, #ffea9f, #d4af37, #8c6302);
    color: #080808;
    font-weight: 900;
    font-size: 16px;
    padding: 15px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
    transition: all 0.35s ease;
    margin-top: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.login-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(212, 175, 55, 0.8);
}

.card-footer {
    margin-top: 18px;
    text-align: center;
    border-top: 1px solid rgba(212, 175, 55, 0.3);
    padding-top: 12px;
    width: 100%;
}

.footer-text-main {
    color: #ffd700;
    font-size: 12px;
    font-weight: bold;
}

.footer-text-sub {
    color: #b0b0b0;
    font-size: 11px;
    margin-top: 3px;
}
</style>
</head>
<body>

    <div class="inner-frame"></div>
    <div class="sparkle" style="top: 12%; left: 15%; width: 5px; height: 5px;"></div>
    <div class="sparkle" style="top: 22%; right: 12%; width: 6px; height: 6px;"></div>

<div class="login-card">
    <div class="crown-top">👑</div>
    
    <div class="marquee-box">
        <div class="moving-text">موقع تعارف ودردشة كلاسيك</div>
    </div>

    <div class="avatar-preview" id="avatarPreviewBox">
        <span id="defaultCrownEmoji" style="font-size: 34px;">👑</span>
        <img id="uploadedImgPreview" src="" alt="صورة الملف الشخصي">
    </div>

    <button type="button" class="avatar-btn" onclick="document.getElementById('avatarInput').click();">
        📷 اختيار صورة الملف الشخصي
    </button>

    <form class="login-form" id="loginForm" onsubmit="handleAuth(event)">
        
        <input type="file" id="avatarInput" name="avatar" accept="image/*" style="display: none;" onchange="previewAvatar(event)">

        <div class="input-group">
            <span class="input-icon">👤</span>
            <input type="text" id="usernameField" name="username" class="login-input" placeholder="اسمك هنا ..." required autocomplete="off">
        </div>

        <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" id="passwordField" name="password" class="login-input" placeholder="كلمة المرور ..." required>
        </div>

        <button type="submit" class="login-btn">
            <span>تسجيل الدخول / الدخول للشات</span> 🚪
        </button>
    </form>

    <div class="card-footer">
        <div class="footer-text-main">مرحبًا بك ⭐ كلاسيك</div>
        <div class="footer-text-sub">تواصل . تعرف ؛ كون صداقات جديدة</div>
    </div>
</div>

<script>
    let tempAvatarBase64 = "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=900"; // صورة افتراضية فاخرة في حال لم يرفع صورة

    function previewAvatar(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                tempAvatarBase64 = e.target.result;
                const img = document.getElementById('uploadedImgPreview');
                const emoji = document.getElementById('defaultCrownEmoji');
                img.src = tempAvatarBase64;
                img.style.display = 'block';
                emoji.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    function handleAuth(event) {
        event.preventDefault(); 

        const username = document.getElementById('usernameField').value.trim();
        const password = document.getElementById('passwordField').value.trim();

        // جلب الأعضاء المسجلين مسبقاً
        let users = JSON.parse(localStorage.getItem('classic_users')) || [];
        let existingUser = users.find(u => u.username === username);

        if (existingUser) {
            // التحقق من كلمة المرور إذا كان الحساب موجوداً
            if (existingUser.password === password) {
                // حفظ المستخدم النشط الحالي ليظهر بصورته في الشات
                localStorage.setItem('current_active_user', JSON.stringify(existingUser));
                window.location.href = '/'; // أو رابط صفحة الشات index.html
            } else {
                alert('كلمة المرور غير صحيحة لهذا الاسم!');
            }
        } else {
            // مستخدم جديد، يتم حفظ بياناته للأبد
            const newUser = {
                username: username,
                password: password,
                avatar: tempAvatarBase64
            };

            users.push(newUser);
            localStorage.setItem('classic_users', JSON.stringify(users));
            localStorage.setItem('current_active_user', JSON.stringify(newUser));

            // الانتقال المباشر للدردشة
            window.location.href = '/'; // استبدل بـ index.html أو اسم صفحة الشات
        }
    }
</script>

</body>
</html>
