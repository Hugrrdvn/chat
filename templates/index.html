<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جروب تعارف ودردشة الملكي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: rgba(15, 15, 26, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #d4af37;
        }
        .chat-header {
            background: #111;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #d4af37;
            font-size: 1.3em;
            font-weight: bold;
            color: #d4af37;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background: #22223b;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            border-right: 4px solid #d4af37;
            word-wrap: break-word;
        }
        .message .username {
            font-size: 0.85em;
            color: #d4af37;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            background: #111;
            border-top: 2px solid #d4af37;
        }
        .chat-input input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            background: #222;
            color: #fff;
            font-size: 1em;
        }
        .chat-input button {
            background: #d4af37;
            color: #111;
            border: none;
            padding: 0 20px;
            margin-right: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .chat-input button:hover {
            background: #f39c12;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">👑 جروب تعارف ودردشة الملكي 👑</div>
        <div class="chat-messages" id="messagesContainer"></div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." />
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const username = "عضو ملكي (" + Math.floor(Math.random() * 1000) + ")";

        async function fetchMessages() {
            try {
                const response = await fetch('/messages');
                const messages = await response.json();
                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';
                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message';
                    div.innerHTML = `<div class="username">${msg.username}</div><div class="text">${msg.text}</div>`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error("خطأ في جلب الرسائل", e);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            await fetch('/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, text: text })
            });

            input.value = '';
            fetchMessages();
        }

        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        setInterval(fetchMessages, 3000);
        fetchMessages();
    </script>
</body>
</html>
