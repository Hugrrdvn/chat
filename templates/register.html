<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - جروب تعارف ودردشة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-xl w-96 border border-gray-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-indigo-400">انضم إلى الشات</h2>
        
        <form action="/" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-2">اسم المستخدم أو اللقب</label>
                <input type="text" name="username" required 
                       class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500 text-white"
                       placeholder="اكتب اسمك هنا...">
            </div>
            <button type="submit" 
                    class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold transition duration-200">
                دخول إلى الدردشة
            </button>
        </form>
    </div>
</body>
</html>
