<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>جروب تعارف ودردشة الملكي | الدردشة الرسمية</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; user-select: none; }
body { 
    background-image: url('https://i.ibb.co/fVgM9d4V/1794133679969-2.jpg');
    background-size: cover; background-position: center; background-repeat: no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 10px 0 16px 0; position: relative;
}
body::before {
    content: ''; position: fixed; top: 6px; bottom: 6px; left: 6px; right: 6px;
    border: 2.5px solid #d4af37; pointer-events: none; z-index: 100;
    box-shadow: inset 0 0 30px rgba(212, 175, 55, 0.5), 0 0 25px rgba(0, 0, 0, 0.95); border-radius: 18px;
}
.header-wrapper { width: 90%; max-width: 390px; flex-shrink: 0; display: flex; flex-direction: column; position: relative; z-index: 10; margin-top: 10px; }
.telegram-header-box {
    width: 100%; background: rgba(12, 12, 12, 0.94); backdrop-filter: blur(12px); color: #ffffff;
    display: flex; align-items: center; justify-content: flex-start; gap: 12px; padding: 10px 16px; border-radius: 22px; 
    border: 1.5px solid #d4af37; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.3);
}
.th-right { display: flex; align-items: center; flex-shrink: 0; cursor: pointer; }
.th-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #ffd700; }
.th-info { display: flex; flex-direction: column; text-align: right; flex: 1; min-width: 0; }
.th-info h3 { font-size: 16px; font-weight: 900; color: #ffd700; text-shadow: 0 1px 4px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.external-active-badge {
    align-self: flex-start; background-color: rgba(12, 12, 12, 0.85); border: 1.2px solid #d4af37;
    color: #ffd700; font-size: 11px; font-weight: 700; padding: 3px 12px; border-radius: 12px; margin-top: 6px; display: inline-flex; align-items: center; gap: 6px;
}
.pulse-dot { width: 7px; height: 7px; background-color: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }
.chat-messages-container { flex: 1; width: 90%; max-width: 390px; overflow-y: auto; padding: 6px 2px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
.message-row { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
.message-row.incoming { align-self: flex-start; }
.message-row.incoming .message-bubble { background: rgba(255, 255, 255, 0.96); border: 1.2px solid #d4af37; border-radius: 14px; }
.message-row.outgoing { align-self: flex-end; flex-direction: row-reverse; }
.message-row.outgoing .message-bubble { background: linear-gradient(135deg, rgba(15, 30, 15, 0.96), rgba(10, 20, 10, 0.96)); border: 1.5px solid #d4af37; border-radius: 14px; }
.message-row.outgoing .msg-text { color: #ffffff; }
.msg-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1.5px solid #d4af37; }
.message-bubble { padding: 6px 12px; display: flex; flex-direction: column; max-width: 250px; word-break: break-word; }
.msg-sender { font-size: 11.5px; font-weight: 800; color: #ffd700; margin-bottom: 2px; }
.msg-text { font-size: 13.5px; font-weight: 600; color: #000; }
.system-msg { align-self: center; background: rgba(212, 175, 55, 0.15); border: 1px solid rgba(212, 175, 55, 0.6); color: #ffd700; font-size: 11px; font-weight: bold; padding: 4px 14px; border-radius: 20px; margin: 6px 0; }
.quick-suggestions-bar { width: 90%; max-width: 390px; display: flex; gap: 5px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; }
.suggestion-chip { background: rgba(15, 15, 15, 0.92); border: 1.2px solid #d4af37; color: #ffd700; font-size: 11px; padding: 5px 12px; border-radius: 16px; white-space: nowrap; cursor: pointer; }
.chat-input-bar { width: 90%; max-width: 390px; background: rgba(10, 10, 10, 0.96); padding: 8px 14px; display: flex; align-items: center; gap: 10px; border-radius: 28px; border: 2px solid #d4af37; margin-bottom: 12px; }
.message-input-field { flex: 1; background: none; border: none; color: #fff; font-size: 14.5px; outline: none; }
.send-btn { width: 38px; height: 38px; background: linear-gradient(135deg, #ffea9f, #d4af37, #8c6302); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; cursor: pointer; border: none; }
</style>
</head>
<body>

<div class="header-wrapper">
    <div class="telegram-header-box">
        <div class="th-right">
            <img class="th-avatar" id="headerGroupAvatar" src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=900" alt="صورة الجروب">
        </div>
        <div class="th-info">
            <h3 id="headerUsernameDisplay">جـروب تـعارف ودردشـة الملكي</h3>
        </div>
    </div>
    <div class="external-active-badge">
        <span class="pulse-dot"></span> <span id="onlineCountText">متصلاً الآن</span>
    </div>
</div>

<div class="chat-messages-container" id="messagesContainer">
    <div class="system-msg">⭐ أهلاً بك في جروب تعارف ودردشة الملكي الفاخر ⭐</div>
</div>

<div class="quick-suggestions-bar">
    <div class="suggestion-chip" onclick="sendSuggestion('مساكم الله بالخير 🌹')">🌹 مساكم الله بالخير</div>
    <div class="suggestion-chip" onclick="sendSuggestion('منورين جميعاً ✨')">✨ منورين جميعاً</div>
    <div class="suggestion-chip" onclick="sendSuggestion('كيف حالكم يا أصدقاء؟ 👋')">👋 كيف حالكم؟</div>
</div>

<div class="chat-input-bar">
    <input type="text" id="messageInput" class="message-input-field" placeholder="اكتب رسالة..." autocomplete="off">
    <button class="send-btn" onclick="sendMessage()">➤</button>
</div>

<script>
    let activeUser = JSON.parse(localStorage.getItem('current_active_user'));
    if (!activeUser) {
        window.location.href = '/';
    }

    const username = activeUser.username;
    const userAvatar = activeUser.avatar;
    let lastMessageCount = 0;

    if (window.Notification && Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    // نغمة تنبيه واضحة وعالية الصوت (SafeUM / Telegram Style محسن)
    function playTelegramSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // نغمة أولى
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(950, audioCtx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(650, audioCtx.currentTime + 0.12);
            gain1.gain.setValueAtTime(0.35, audioCtx.currentTime); // صوت عالي وواضح
            gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 0.12);

            // نغمة ثانية متتابعة
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
                gain2.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.15);
            }, 100);

        } catch(e) {}
    }

    function showRoyalNotification(sender, text) {
        if (window.Notification && Notification.permission === "granted") {
            try {
                new Notification("👑 رسالة جديدة في الجروب الملكي", {
                    body: `${sender}: ${text}`,
                    icon: userAvatar
                });
            } catch (e) {}
        }
    }

    async function updateStatsAndMembers() {
        try {
            await fetch('/members', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username })
            });

            const res = await fetch('/members');
            const data = await res.json();
            document.getElementById('onlineCountText').textContent = data.online_count + " متصلاً الآن";
        } catch (e) {}
    }

    async function fetchMessages() {
        try {
            const response = await fetch('/messages');
            const messages = await response.json();
            const container = document.getElementById('messagesContainer');
            
            const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;

            if (lastMessageCount > 0 && messages.length > lastMessageCount) {
                playTelegramSound();
                const latestMsg = messages[messages.length - 1];
                if (latestMsg.username !== username) {
                    showRoyalNotification(latestMsg.username, latestMsg.text);
                }
            }
            lastMessageCount = messages.length;

            container.innerHTML = '<div class="system-msg">⭐ أهلاً بك في جروب تعارف ودردشة الملكي الفاخر ⭐</div>';

            messages.forEach(msg => {
                const row = document.createElement('div');
                const isMe = msg.username === username;
                row.className = isMe ? 'message-row outgoing' : 'message-row incoming';

                let avatarUrl = isMe ? userAvatar : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900';

                row.innerHTML = `
                    <img class="msg-avatar" src="${avatarUrl}" alt="صورة">
                    <div class="message-bubble">
                        <span class="msg-sender">${msg.username}</span>
                        <span class="msg-text">${msg.text}</span>
                    </div>
                `;
                container.appendChild(row);
            });

            if (isAtBottom || messages.length <= 5) {
                container.scrollTop = container.scrollHeight;
            }
        } catch (e) {}
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        playTelegramSound();

        try {
            await fetch('/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, text: text })
            });
            input.value = '';
            fetchMessages();
        } catch (e) {}
    }

    function sendSuggestion(text) {
        document.getElementById('messageInput').value = text;
        sendMessage();
    }

    document.getElementById('messageInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    setInterval(() => {
        fetchMessages();
        updateStatsAndMembers();
    }, 3000);

    fetchMessages();
    updateStatsAndMembers();
</script>

</body>
</html>
