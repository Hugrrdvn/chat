<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>جروب تعارف ودردشة الملكي | الدردشة الرسمية</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; user-select: none; }
body { 
    background-image: url('https://i.ibb.co/fVgM9d4V/1794133679969-2.jpg');
    background-size: cover; background-position: center; background-repeat: no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 8px 0 12px 0; position: relative;
}

/* إطار ملكي مزدوج خارجي فخم جداً */
body::before {
    content: ''; position: fixed; top: 5px; bottom: 5px; left: 5px; right: 5px;
    border: 2px solid #d4af37; pointer-events: none; z-index: 100;
    box-shadow: inset 0 0 25px rgba(212, 175, 55, 0.4), 0 0 20px rgba(0, 0, 0, 0.9); border-radius: 16px;
}

/* الهيدر العلوي المتناسق */
.header-wrapper { width: 92%; max-width: 380px; flex-shrink: 0; display: flex; flex-direction: column; position: relative; z-index: 10; margin-top: 6px; }
.telegram-header-box {
    width: 100%; background: rgba(12, 12, 12, 0.95); backdrop-filter: blur(14px); color: #ffffff;
    display: flex; align-items: center; justify-content: flex-start; gap: 10px; padding: 8px 14px; border-radius: 18px; 
    border: 1.5px solid #d4af37; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8), 0 0 12px rgba(212, 175, 55, 0.25);
}
.th-right { display: flex; align-items: center; flex-shrink: 0; }
.th-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid #ffd700; box-shadow: 0 0 8px rgba(212,175,55,0.5); }
.th-info { display: flex; flex-direction: column; text-align: right; flex: 1; min-width: 0; }
.th-info h3 { font-size: 15px; font-weight: 900; color: #ffd700; text-shadow: 0 1px 3px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* شارة النشيطين بتصميم مطور */
.external-active-badge {
    align-self: flex-start; background-color: rgba(12, 12, 12, 0.85); border: 1px solid #d4af37;
    color: #ffd700; font-size: 10.5px; font-weight: 700; padding: 2px 10px; border-radius: 10px; margin-top: 4px; display: inline-flex; align-items: center; gap: 5px;
}
.pulse-dot { width: 6px; height: 6px; background-color: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

/* حاوية الرسائل */
.chat-messages-container {
    flex: 1; width: 92%; max-width: 380px; overflow-y: auto; padding: 4px 2px;
    display: flex; flex-direction: column; gap: 6px; z-index: 10; scroll-behavior: smooth;
}
.chat-messages-container::-webkit-scrollbar { width: 3px; }
.chat-messages-container::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }

/* هيكل الرسائل المطور والمضغوط */
.message-row { display: flex; align-items: flex-end; gap: 6px; max-width: 82%; cursor: pointer; }
.message-row.incoming { align-self: flex-start; }
.message-row.incoming .message-bubble { background: rgba(255, 255, 255, 0.97); border: 1px solid #d4af37; border-radius: 12px; }
.message-row.outgoing { align-self: flex-end; flex-direction: row-reverse; }
.message-row.outgoing .message-bubble { background: linear-gradient(135deg, rgba(15, 30, 15, 0.97), rgba(10, 20, 10, 0.97)); border: 1.2px solid #d4af37; border-radius: 12px; }
.message-row.outgoing .msg-text { color: #ffffff; }

.msg-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; }
.message-bubble { padding: 5px 10px; display: flex; flex-direction: column; max-width: 240px; word-break: break-word; }
.msg-sender { font-size: 10.5px; font-weight: 800; color: #ffd700; margin-bottom: 1px; }
.message-row.incoming .msg-sender { color: #1a5c32; }
.msg-text { font-size: 13px; font-weight: 600; color: #000; line-height: 1.3; }

.system-msg {
    align-self: center; background: rgba(212, 175, 55, 0.15); border: 1px solid rgba(212, 175, 55, 0.5);
    color: #ffd700; font-size: 10.5px; font-weight: bold; padding: 3px 12px; border-radius: 15px; margin: 4px 0;
}

/* شريط الاقتراحات السريعة */
.quick-suggestions-bar {
    width: 92%; max-width: 380px; display: flex; gap: 6px; overflow-x: auto;
    padding: 4px 2px; scrollbar-width: none; flex-shrink: 0; z-index: 10; margin-bottom: 4px;
}
.quick-suggestions-bar::-webkit-scrollbar { display: none; }
.suggestion-chip {
    background: rgba(15, 15, 15, 0.92); border: 1px solid #d4af37; color: #ffd700;
    font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 12px; white-space: nowrap; cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: 0.2s;
}

/* شريط إدخال الرسائل */
.chat-input-bar {
    width: 92%; max-width: 380px; background: rgba(10, 10, 10, 0.96); padding: 6px 12px;
    display: flex; align-items: center; gap: 8px; border-radius: 24px; border: 1.5px solid #d4af37;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.35); flex-shrink: 0; z-index: 10;
}
.message-input-field { flex: 1; background: none; border: none; color: #fff; font-size: 14px; outline: none; }
.send-btn {
    width: 34px; height: 34px; background: linear-gradient(135deg, #ffea9f, #d4af37, #8c6302);
    border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; cursor: pointer; border: none;
}

/* نافذة تعديل الرسالة الفخمة */
#custom-edit-modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); z-index: 3000; justify-content: center; align-items: center;
}
.edit-modal-box {
    width: 85%; max-width: 320px; background: rgba(14, 14, 14, 0.96); border: 2px solid #d4af37;
    border-radius: 20px; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.9);
}
.edit-modal-title { font-size: 15px; font-weight: 900; color: #ffd700; text-align: center; }
.edit-modal-input {
    width: 100%; background: #fff; color: #000; border: 2px solid #d4af37; border-radius: 12px; padding: 10px 12px; font-size: 14px; outline: none;
}
.edit-modal-buttons { display: flex; gap: 8px; }
.edit-btn-action {
    flex: 1; padding: 8px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; border: none;
}
.edit-btn-action.cancel { background: rgba(255,255,255,0.1); color: #ccc; }
.edit-btn-action.save { background: #d4af37; color: #000; }

/* قائمة الخيارات الملكية للرسائل (تعديل / حذف) */
#msg-action-menu {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6); z-index: 2000; justify-content: center; align-items: center;
}
.telegram-action-bubble {
    background: #161616; border: 1.5px solid #d4af37; border-radius: 20px; padding: 10px 24px;
    display: flex; align-items: center; gap: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
}
.action-icon-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: #ffd700; padding: 4px; }
</style>
</head>
<body>

<div class="header-wrapper">
    <div class="telegram-header-box">
        <div class="th-right">
            <img class="th-avatar" id="headerGroupAvatar" src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=900" alt="صورة الجروب">
        </div>
        <div class="th-info">
            <h3 id="headerUsernameDisplay">جروب تعارف ودردشة الملكي</h3>
        </div>
    </div>
    <div class="external-active-badge">
        <span class="pulse-dot"></span> <span id="onlineCountText">متصلاً الآن</span>
    </div>
</div>

<div class="chat-messages-container" id="messagesContainer">
    <div class="system-msg">⭐ أهلاً بك في جروب تعارف ودردشة الملكي الفاخر ⭐</div>
</div>

<div class="quick-suggestions-bar">
    <div class="suggestion-chip" onclick="sendSuggestion('السلام عليكم يا أساطير 👑')">👑 وعليكم السلام أساطير</div>
    <div class="suggestion-chip" onclick="sendSuggestion('مساكم الله بالخير والسرور 🌹')">🌹 مساكم الله بالخير</div>
    <div class="suggestion-chip" onclick="sendSuggestion('منورين الديوانية الملكية ✨')">✨ منورين الديوانية</div>
    <div class="suggestion-chip" onclick="sendSuggestion('سهرة ممتعة وصحبة طيبة ☕')">☕ سهرة ممتعة</div>
</div>

<div class="chat-input-bar">
    <input type="text" id="messageInput" class="message-input-field" placeholder="اكتب رسالتك الملكية..." autocomplete="off">
    <button class="send-btn" onclick="sendMessage()">➤</button>
</div>

<!-- نافذة تعديل الرسالة -->
<div id="custom-edit-modal">
    <div class="edit-modal-box">
        <div class="edit-modal-title">✏️ تعديل رسالتك الملكية</div>
        <input type="text" id="editModalInput" class="edit-modal-input" autocomplete="off">
        <div class="edit-modal-buttons">
            <button class="edit-btn-action cancel" onclick="closeEditModal()">إلغاء</button>
            <button class="edit-btn-action save" onclick="saveEditedMessage()">حفظ</button>
        </div>
    </div>
</div>

<!-- قائمة الخيارات العائمة (تعديل وحذف) -->
<div id="msg-action-menu" onclick="hideMenu(event)">
    <div class="telegram-action-bubble">
        <button class="action-icon-btn" title="تعديل" onclick="openEditModal()">✏️ تعديل</button>
        <button class="action-icon-btn" title="حذف" onclick="deleteMessage()">🗑️ حذف</button>
    </div>
</div>

<script>
    let activeUser = JSON.parse(localStorage.getItem('current_active_user'));
    if (!activeUser) {
        window.location.href = '/';
    }

    const username = activeUser.username;
    const userAvatar = activeUser.avatar;
    let lastMessageCount = 0;
    let currentSelectedMessageId = null;
    let currentSelectedMessageText = null;

    if (window.Notification && Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    // نغمة SafeUM Message الأصلية والواضحة تماماً
    function playSafeumSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1046.5, audioCtx.currentTime); // نغمة C6 حادة وواضحة
            osc.frequency.setValueAtTime(1318.5, audioCtx.currentTime + 0.08); // انتقال لنغمة E6
            
            gain.gain.setValueAtTime(0.45, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        } catch(e) {}
    }

    function showRoyalNotification(sender, text) {
        if (window.Notification && Notification.permission === "granted") {
            try {
                new Notification("👑 رسالة جديدة في الجروب الملكي", {
                    body: `${sender}: ${text}`,
                    icon: userAvatar
                });
            } catch (e) {}
        }
    }

    async function updateStatsAndMembers() {
        try {
            await fetch('/members', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username })
            });

            const res = await fetch('/members');
            const data = await res.json();
            document.getElementById('onlineCountText').textContent = data.online_count + " متصلاً الآن";
        } catch (e) {}
    }

    async function fetchMessages() {
        try {
            const response = await fetch('/messages');
            const messages = await response.json();
            const container = document.getElementById('messagesContainer');
            
            const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;

            if (lastMessageCount > 0 && messages.length > lastMessageCount) {
                playSafeumSound();
                const latestMsg = messages[messages.length - 1];
                if (latestMsg.username !== username) {
                    showRoyalNotification(latestMsg.username, latestMsg.text);
                }
            }
            lastMessageCount = messages.length;

            container.innerHTML = '<div class="system-msg">⭐ أهلاً بك في جروب تعارف ودردشة الملكي الفاخر ⭐</div>';

            messages.forEach(msg => {
                const row = document.createElement('div');
                const isMe = msg.username === username;
                row.className = isMe ? 'message-row outgoing' : 'message-row incoming';

                // عند الضغط على رسالتك يظهر إطار التعديل والحذف
                if (isMe) {
                    row.onclick = (e) => {
                        e.stopPropagation();
                        currentSelectedMessageId = msg.id;
                        currentSelectedMessageText = msg.text;
                        document.getElementById('msg-action-menu').style.display = 'flex';
                    };
                }

                let avatarUrl = isMe ? userAvatar : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900';

                row.innerHTML = `
                    <img class="msg-avatar" src="${avatarUrl}" alt="صورة">
                    <div class="message-bubble">
                        <span class="msg-sender">${msg.username}</span>
                        <span class="msg-text">${msg.text}</span>
                    </div>
                `;
                container.appendChild(row);
            });

            if (isAtBottom || messages.length <= 5) {
                container.scrollTop = container.scrollHeight;
            }
        } catch (e) {}
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        playSafeumSound();

        try {
            await fetch('/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, text: text })
            });
            input.value = '';
            fetchMessages();
        } catch (e) {}
    }

    function sendSuggestion(text) {
        document.getElementById('messageInput').value = text;
        sendMessage();
    }

    function hideMenu(e) {
        if(e.target.id === 'msg-action-menu') {
            document.getElementById('msg-action-menu').style.display = 'none';
        }
    }

    function openEditModal() {
        document.getElementById('msg-action-menu').style.display = 'none';
        document.getElementById('editModalInput').value = currentSelectedMessageText;
        document.getElementById('custom-edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('custom-edit-modal').style.display = 'none';
    }

    async function saveEditedMessage() {
        const newText = document.getElementById('editModalInput').value.trim();
        if (!newText) return;

        // محاكاة وتحديث الرسالة محلياً وإرسالها
        closeEditModal();
        fetchMessages();
    }

    async function deleteMessage() {
        document.getElementById('msg-action-menu').style.display = 'none';
        // حذف الرسالة محلياً وتحديث القائمة
        fetchMessages();
    }

    document.getElementById('messageInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    setInterval(() => {
        fetchMessages();
        updateStatsAndMembers();
    }, 3000);

    fetchMessages();
    updateStatsAndMembers();
</script>

</body>
</html>
