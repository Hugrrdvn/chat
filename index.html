<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>دردشة النخبة الملكية</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
body { background: #0c0219; height: 100vh; color: white; overflow: hidden; }
/* الشاشة الرئيسية */
#login-screen { position: fixed; inset: 0; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: auto; display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle at 50% 20%, rgba(192,132,252,.35), transparent 60%), linear-gradient(135deg,#090314,#1b0a3a,#090314); border: 2px solid #581c87; box-shadow: 0 0 40px rgba(168,85,247,.4); overflow: hidden; transform: none !important; }
/* صورة التعارف في الأسفل */
.dating-background { position: absolute; bottom: 0; left: 0; width: 100%; height: 34%; background-image: linear-gradient( to bottom, #0c0219 0%, rgba(12,2,25,.35) 35%, rgba(12,2,25,.15) 100% ), url('https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=900'); background-size: cover; background-position: center; opacity: .75; z-index: 0; }
/* إطار الزوايا */
.corner-frame { position: absolute; inset: 16px; pointer-events: none; z-index: 20; }
.corner { position: absolute; width: 38px; height: 38px; border-color: #c084fc; border-style: solid; filter: drop-shadow(0 0 6px #a855f7); }
.top-right { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 12px 0 0; }
.top-left { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 12px 0 0 0; }
.bottom-right { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
.bottom-left { bottom: 0; left: 0; border-width: 0 0 3px 3px; }
/* دائرة الصورة */
.avatar-container { position: absolute; top: 65px; width: 145px; height: 145px; z-index: 5; flex-shrink: 0; }
.crown-icon { position: absolute; top: -45px; left: 50%; transform: translateX(-50%); font-size: 52px; z-index: 10; filter: drop-shadow(0 0 18px #f43f5e) drop-shadow(0 0 30px #fbbf24); }
.avatar-circle { width: 145px; height: 145px; min-width: 145px; min-height: 145px; border-radius: 50%; background: rgba(25,10,50,.85); border: 4px solid #c084fc; display: flex; justify-content: center; align-items: center; overflow: hidden; cursor: pointer; flex-shrink: 0; box-shadow: 0 0 35px rgba(192,132,252,.7), inset 0 0 15px rgba(168,85,247,.5); }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.avatar-placeholder { font-size: 13px; color: #f3e8ff; text-align: center; padding: 15px; font-weight: bold; }
#file-input { display: none; }
/* خانة الاسم */
.input-box-container { position: absolute; top: 52%; left: 5%; width: 90%; background: rgba(22,10,45,.9); border: none; border-radius: 20px; padding: 10px 18px; box-shadow: 0 12px 30px rgba(0,0,0,.8), inset 0 2px 10px rgba(192,132,252,.3); z-index: 5; }
.input-box-container input { width: 100%; background: transparent; border: none; outline: none; color: white; font-size: 21px; text-align: center; font-weight: bold; user-select: text; -webkit-user-select: text; }
.input-box-container input::placeholder { color: #d8b4fe; opacity: .8; }
/* زر ادخل (مصغر، بدون لون خلفية، بنفس نمط إطار خانة الاسم) */
#login-btn { position: absolute; bottom: 45px; left: 15%; width: 70%; background: rgba(22,10,45,.9); color: white; border: none; padding: 8px 14px; border-radius: 20px; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,.8), inset 0 2px 10px rgba(192,132,252,.3); display: flex; justify-content: center; align-items: center; z-index: 10; flex-shrink: 0; }
#login-btn:active { opacity: .85; }
/* شاشة المحادثة */
#chat-screen { display: none; width: 100%; max-width: 650px; height: 100vh; height: 100dvh; background: #0f071e; flex-direction: column; position: relative; margin: auto; }
.chat-header { background: #180b2e; padding: 15px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #3b0764; }
.header-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #c084fc; }
.chat-header-info h3 { font-size: 16px; color: #e9d5ff; }
.online-badge { font-size: 11px; color: #4ade80; }
.chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background-image: radial-gradient(#2e1065 1px, transparent 1px); background-size: 25px 25px; }
.message { max-width: 75%; padding: 12px 16px; border-radius: 16px; word-wrap: break-word; font-size: 15px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.message.incoming { background: #1e1035; align-self: flex-start; color: #f3e8ff; border: 1px solid #3b0764; }
.message.outgoing { background: #6b21a8; align-self: flex-end; color: white; flex-direction: row-reverse; }
.msg-content { display: flex; flex-direction: column; }
.msg-user { font-size: 12px; font-weight: 800; color: #d8b4fe; margin-bottom: 3px; }
.msg-text { line-height: 1.5; }
.msg-time { font-size: 10px; color: #c4b5fd; margin-top: 4px; }
#action-menu { display: none; position: absolute; background: #1e1035; border: 1px solid #7c3aed; border-radius: 12px; z-index: 100; overflow: hidden; }
.menu-item { padding: 12px 20px; font-size: 14px; color: #f3e8ff; cursor: pointer; border-bottom: 1px solid #3b0764; display: flex; align-items: center; gap: 10px; }
.chat-input-area { background: #180b2e; padding: 15px; display: flex; gap: 12px; align-items: center; border-top: 1px solid #3b0764; }
.chat-input-area input { flex: 1; padding: 14px 18px; background: #0f071e; border: 1px solid #581c87; color: white; border-radius: 30px; outline: none; font-size: 15px; user-select: text; -webkit-user-select: text; }
.chat-input-area button { background: #7c3aed; color: white; border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; font-size: 18px; }
</style>
</head>
<body>
<div id="login-screen">
<div class="dating-background"></div>
<div class="corner-frame">
<span class="corner top-right"></span>
<span class="corner top-left"></span>
<span class="corner bottom-right"></span>
<span class="corner bottom-left"></span>
</div>
<div class="avatar-container">
<div class="crown-icon">👑</div>
<div class="avatar-circle" onclick="document.getElementById('file-input').click()">
<span class="avatar-placeholder" id="avatar-text">اضغط لاختيار صورتك</span>
<img id="avatar-preview" src="" style="display:none;">
</div>
<input type="file" id="file-input" accept="image/*" onchange="loadLocalImage(event)">
</div>
<div class="input-box-container">
<input type="text" id="username-input" maxlength="9" placeholder="اكتب اسمك هنا">
</div>
<button id="login-btn" onclick="checkAndJoin()">ادخل</button>
</div>

<div id="chat-screen">
<div class="chat-header">
<img id="header-user-avatar" class="header-avatar">
<div class="chat-header-info">
<h3 id="header-user-name">الغرفة الملكية</h3>
<span class="online-badge">● متصل الآن</span>
</div>
</div>
<div class="chat-messages" id="messages-box"></div>
<div id="action-menu">
<div class="menu-item" onclick="copySelectedText()">📋 نسخ النص</div>
<div class="menu-item" id="edit-menu-btn" onclick="editSelectedMessage()" style="display:none;">✏️ تعديل الرسالة</div>
</div>
<div class="chat-input-area">
<input type="text" id="msg-input" placeholder="اكتب رسالتك..." onkeypress="checkEnter(event)">
<button id="send-btn-action" onclick="sendMessage()">➤</button>
</div>
</div>

<script>
let myName = "";
let myAvatar = "https://i.imgur.com/6VBx3io.png";
let activeMessageId = null;
let activeMessageText = "";
let activeMessageUser = "";
let isEditing = false;
let editTargetId = null;

function loadLocalImage(event) {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(e) {
myAvatar = e.target.result;
document.getElementById('avatar-preview').src = myAvatar;
document.getElementById('avatar-preview').style.display = 'block';
document.getElementById('avatar-text').style.display = 'none';
};
reader.readAsDataURL(file);
}

function checkAndJoin() {
const nameInput = document.getElementById('username-input').value.trim();

if (nameInput.length < 3 || nameInput.length >= 10) {
return;
}

fetch('/check-name', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({user: nameInput})
})
.then(res => res.json())
.then(data => {
if (!data.taken) {
myName = nameInput;
document.getElementById('header-user-avatar').src = myAvatar;
document.getElementById('header-user-name').innerText = `الغرفة (${myName})`;
document.getElementById('login-screen').style.display = 'none';
document.getElementById('chat-screen').style.display = 'flex';
fetchMessages();
setInterval(fetchMessages, 2000);
}
})
.catch(() => alert('تعذر الاتصال بالخادم!'));
}

function checkEnter(e) {
if (e.key === 'Enter') sendMessage();
}

function sendMessage() {
const input = document.getElementById('msg-input');
const text = input.value.trim();
if (!text) return;

if (isEditing) {
fetch('/edit', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ id: editTargetId, text: text, user: myName })
}).then(() => {
input.value = '';
isEditing = false;
editTargetId = null;
document.getElementById('send-btn-action').innerText = "➤";
fetchMessages();
});
} else {
fetch('/send', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ user: myName, text: text, avatar: myAvatar })
}).then(() => {
input.value = '';
fetchMessages();
});
}
}

function fetchMessages() {
fetch('/messages')
.then(res => res.json())
.then(data => {
const box = document.getElementById('messages-box');
box.innerHTML = '';
data.forEach(msg => {
const div = document.createElement('div');
const isMe = msg.user === myName;
div.className = `message ${isMe ? 'outgoing' : 'incoming'}`;
const timeStr = new Date(msg.time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const avatar = document.createElement('img');
avatar.className = 'msg-avatar';
avatar.src = msg.avatar || myAvatar;
const content = document.createElement('div');
content.className = 'msg-content';
const username = document.createElement('span');
username.className = 'msg-user';
username.textContent = msg.user;
const messageText = document.createElement('div');
messageText.className = 'msg-text';
messageText.textContent = msg.text;
const time = document.createElement('span');
time.className = 'msg-time';
time.textContent = timeStr;
content.append(username, messageText, time);
div.append(avatar, content);
div.onclick = (e) => {
e.stopPropagation();
showActionMenu(e, msg.id, msg.text, msg.user);
};
box.appendChild(div);
});
});
}

function showActionMenu(e, id, text, user) {
const menu = document.getElementById('action-menu');
activeMessageId = id;
activeMessageText = text;
activeMessageUser = user;
menu.style.display = 'block';
menu.style.top = `${Math.min(e.clientY, window.innerHeight - 120)}px`;
menu.style.left = `${Math.min(e.clientX, window.innerWidth - 160)}px`;
document.getElementById('edit-menu-btn').style.display = user === myName ? 'flex' : 'none';
}

window.onclick = function() {
document.getElementById('action-menu').style.display = 'none';
};

function copySelectedText() {
navigator.clipboard.writeText(activeMessageText).then(() => alert('تم نسخ النص بنجاح!'));
}

function editSelectedMessage() {
isEditing = true;
editTargetId = activeMessageId;
const input = document.getElementById('msg-input');
input.value = activeMessageText;
input.focus();
document.getElementById('send-btn-action').innerText = "✔";
}
</script>
</body>
</html>
