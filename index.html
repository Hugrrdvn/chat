<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دردشة جماعية حية</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 14px;
      background: #eef2f7; color: #182230;
      font-family: Tahoma, Arial, sans-serif;
    }
    .chat {
      width: min(720px, 100%); margin: 20px auto; background: #fff;
      border-radius: 16px; box-shadow: 0 8px 30px #172b4d18; overflow: hidden;
    }
    header { padding: 22px; background: #1457a6; color: white; text-align: center; }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 8px 0 0; opacity: .9; }
    .form { padding: 16px; display: grid; gap: 10px; border-bottom: 1px solid #e5eaf0; }
    input, textarea, button {
      width: 100%; border-radius: 9px; padding: 12px;
      font: inherit; border: 1px solid #ccd5e0;
    }
    textarea { resize: vertical; min-height: 74px; }
    button { background: #1457a6; color: white; border: 0; cursor: pointer; font-weight: bold; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { color: #64748b; font-size: 13px; min-height: 18px; }
    #messages { padding: 16px; min-height: 240px; max-height: 55vh; overflow-y: auto; }
    .message { padding: 11px 13px; margin-bottom: 10px; background: #f1f5f9; border-radius: 10px; overflow-wrap: anywhere; }
    .meta { display: flex; justify-content: space-between; gap: 12px; color: #526174; font-size: 12px; margin-bottom: 6px; }
    .content { white-space: pre-wrap; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <h1>غرفة الدردشة العامة</h1>
      <p>أرسل رسالتك لتظهر للجميع</p>
    </header>

    <form class="form" id="chatForm">
      <input id="username" maxlength="100" placeholder="اسمك" autocomplete="nickname" required>
      <textarea id="content" maxlength="5000" placeholder="اكتب رسالتك هنا..." required></textarea>
      <button id="sendButton" type="submit">إرسال للجميع</button>
      <div id="status" role="status">جاري تحميل الرسائل...</div>
    </form>

    <section id="messages" aria-live="polite"></section>
  </main>

  <script>
    const messagesEl = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const form = document.getElementById("chatForm");
    const sendButton = document.getElementById("sendButton");

    function addMessage(message) {
      const box = document.createElement("article");
      box.className = "message";

      const meta = document.createElement("div");
      meta.className = "meta";
      const name = document.createElement("strong");
      name.textContent = message.username;
      const time = document.createElement("span");
      time.textContent = message.timestamp;
      meta.append(name, time);

      const content = document.createElement("div");
      content.className = "content";
      content.textContent = message.content;

      box.append(meta, content);
      messagesEl.appendChild(box);
    }

    async function loadMessages() {
      try {
        const response = await fetch("/api/get_messages");
        if (!response.ok) throw new Error("تعذر جلب الرسائل");
        const messages = await response.json();
        messagesEl.replaceChildren();
        messages.forEach(addMessage);
        statusEl.textContent = messages.length ? "الدردشة متصلة" : "لا توجد رسائل بعد.";
      } catch (error) {
        statusEl.textContent = "تعذر الاتصال بالسيرفر. حاول تحديث الصفحة.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      const content = document.getElementById("content").value.trim();
      if (!username || !content) return;

      sendButton.disabled = true;
      statusEl.textContent = "جارٍ إرسال الرسالة...";
      try {
        const response = await fetch("/api/send_message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, content })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "فشل الإرسال");
        document.getElementById("content").value = "";
        await loadMessages();
        statusEl.textContent = "تم إرسال رسالتك.";
      } catch (error) {
        statusEl.textContent = error.message;
      } finally {
        sendButton.disabled = false;
      }
    });

    loadMessages();
    setInterval(loadMessages, 3000);
  </script>
</body>
</html>
