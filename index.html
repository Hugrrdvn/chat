<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>جروب تعارف ودردشة</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-user-select: none; }
body { background: #0c0219; height: 100vh; color: white; overflow: hidden; }

/* شاشة تسجيل الدخول وتعديل الملف */
#login-screen { display: none; position: fixed; inset: 0; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: auto; flex-direction: column; align-items: center; background: radial-gradient(circle at 50% 20%, rgba(192,132,252,.35), transparent 60%), linear-gradient(135deg,#090314,#1b0a3a,#090314); border: 2px solid #581c87; box-shadow: 0 0 40px rgba(168,85,247,.4); z-index: 200; }
.dating-background { position: absolute; bottom: 0; left: 0; width: 100%; height: 34%; background-image: linear-gradient(to bottom, #0c0219 0%, rgba(12,2,25,.35) 35%, rgba(12,2,25,.15) 100%), url('https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=900'); background-size: cover; background-position: center; opacity: .75; z-index: 0; }
.corner-frame { position: absolute; inset: 16px; pointer-events: none; z-index: 20; }
.corner { position: absolute; width: 38px; height: 38px; border-color: #c084fc; border-style: solid; filter: drop-shadow(0 0 6px #a855f7); }
.top-right { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 12px 0 0; }
.top-left { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 12px 0 0 0; }
.bottom-right { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
.bottom-left { bottom: 0; left: 0; border-width: 0 0 3px 3px; }

.avatar-container { position: absolute; top: 65px; width: 145px; height: 145px; z-index: 5; }
.crown-icon { position: absolute; top: -45px; left: 50%; transform: translateX(-50%); font-size: 52px; z-index: 10; filter: drop-shadow(0 0 18px #f43f5e) drop-shadow(0 0 30px #fbbf24); }
.avatar-circle { width: 145px; height: 145px; border-radius: 50%; background: rgba(25,10,50,.85); border: 4px solid #c084fc; display: flex; justify-content: center; align-items: center; overflow: hidden; cursor: pointer; box-shadow: 0 0 35px rgba(192,132,252,.7), inset 0 0 15px rgba(168,85,247,.5); }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.avatar-placeholder { font-size: 13px; color: #f3e8ff; text-align: center; padding: 15px; font-weight: bold; }
#file-input { display: none; }

.input-box-container { position: absolute; top: 52%; left: 5%; width: 90%; background: rgba(22,10,45,.9); border-radius: 20px; padding: 10px 18px; box-shadow: 0 12px 30px rgba(0,0,0,.8), inset 0 2px 10px rgba(192,132,252,.3); z-index: 5; }
.input-box-container input { width: 100%; background: transparent; border: none; outline: none; color: white; font-size: 21px; text-align: center; font-weight: bold; user-select: text; -webkit-user-select: text; }
.input-box-container input::placeholder { color: #d8b4fe; opacity: .8; }

#login-btn { position: absolute; bottom: 45px; left: 15%; width: 70%; background: rgba(22,10,45,.9); color: white; border: none; padding: 8px 14px; border-radius: 20px; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,.8), inset 0 2px 10px rgba(192,132,252,.3); z-index: 10; }

/* شاشة معلومات الجروب المطابقة للصورة تماماً */
#group-info-modal { display: none; position: fixed; inset: 0; background: #0b0216; z-index: 150; overflow-y: auto; flex-direction: column; max-width: 650px; margin: auto; }
.gi-header { background: #120524; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2e1065; position: sticky; top: 0; z-index: 10; }
.gi-back { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }

.gi-top-box { display: flex; flex-direction: column; align-items: center; padding: 20px 15px 15px; background: #0b0216; text-align: center; }
.gi-big-avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #c084fc; margin-bottom: 12px; box-shadow: 0 0 25px rgba(192,132,252,0.3); }
.gi-group-name { font-size: 21px; font-weight: bold; color: white; margin-bottom: 4px; }
.gi-members-count { font-size: 13px; color: #a78bfa; margin-bottom: 10px; }
.gi-desc { font-size: 13px; color: #d8b4fe; padding: 0 20px; line-height: 1.5; margin-bottom: 15px; }

.gi-action-buttons { display: flex; justify-content: center; gap: 30px; margin-bottom: 15px; }
.gi-action-btn-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.gi-circle-icon { width: 48px; height: 48px; border-radius: 50%; background: #180b2e; border: 1px solid #581c87; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #c084fc; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.gi-action-label { font-size: 12px; color: #c4b5fd; }

.gi-tabs { display: flex; border-bottom: 1px solid #2e1065; background: #0b0216; }
.gi-tab { flex: 1; text-align: center; padding: 12px; font-size: 14px; color: #9ca3af; cursor: pointer; font-weight: bold; position: relative; }
.gi-tab.active { color: #4ade80; }
.gi-tab.active::after { content: ''; position: absolute; bottom: 0; left: 25%; width: 50%; height: 3px; background: #4ade80; border-radius: 3px 3px 0 0; }

.gi-members-section { padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; }
.gi-section-title { font-size: 12px; color: #a78bfa; padding: 5px 10px; font-weight: bold; }
.gi-member-item { display: flex; align-items: center; justify-content: space-between; background: #120524; padding: 10px 14px; border-radius: 12px; border: 1px solid #2e1065; }
.gi-member-info { display: flex; align-items: center; gap: 12px; }
.gi-member-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1px solid #581c87; }
.gi-member-name { font-size: 15px; font-weight: bold; color: white; }
.gi-member-status { font-size: 12px; color: #a78bfa; margin-top: 2px; }
.gi-role-badge { font-size: 11px; color: #4ade80; background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.3); padding: 4px 10px; border-radius: 8px; font-weight: bold; }

/* شاشة المحادثة الأساسية */
#chat-screen { display: flex; width: 100%; max-width: 650px; height: 100vh; height: 100dvh; background: #0f071e; flex-direction: column; position: relative; margin: auto; }
.chat-header { background: #180b2e; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3b0764; }
.header-left { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.header-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #c084fc; }
.chat-header-info h3 { font-size: 15px; color: #e9d5ff; }
.online-badge { font-size: 11px; color: #4ade80; }
.group-info-btn { background: #581c87; color: #d8b4fe; border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }

.chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-image: radial-gradient(#2e1065 1px, transparent 1px); background-size: 25px 25px; }
.message { max-width: 75%; padding: 10px 14px; border-radius: 14px; word-wrap: break-word; font-size: 14px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.msg-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.message.incoming { background: #1e1035; align-self: flex-start; color: #f3e8ff; border: 1px solid #3b0764; }
.message.outgoing { background: #6b21a8; align-self: flex-end; color: white; flex-direction: row-reverse; }
.msg-content { display: flex; flex-direction: column; }
.msg-user { font-size: 11px; font-weight: 800; color: #d8b4fe; margin-bottom: 2px; }
.msg-text { line-height: 1.4; }
.msg-time { font-size: 9px; color: #c4b5fd; margin-top: 3px; }

#action-menu { display: none; position: absolute; background: #1e1035; border: 1px solid #7c3aed; border-radius: 12px; z-index: 100; overflow: hidden; }
.menu-item { padding: 10px 16px; font-size: 13px; color: #f3e8ff; cursor: pointer; border-bottom: 1px solid #3b0764; display: flex; align-items: center; gap: 8px; }

.chat-input-area { background: #180b2e; padding: 10px 15px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #3b0764; position: relative; }
.input-wrapper { flex: 1; display: flex; align-items: center; background: #0f071e; border: 1px solid #581c87; border-radius: 24px; padding: 0 12px; position: relative; }
.input-wrapper input { flex: 1; padding: 10px 0; background: transparent; border: none; color: white; outline: none; font-size: 14px; user-select: text; -webkit-user-select: text; }
.emoji-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 0 4px; opacity: .8; }
.emoji-btn:hover { opacity: 1; }
.chat-input-area button.send-submit { background: #7c3aed; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

#emoji-picker { display: none; position: absolute; bottom: 65px; left: 15px; background: #1e1035; border: 1px solid #7c3aed; border-radius: 12px; padding: 8px; grid-template-columns: repeat(6, 1fr); gap: 6px; z-index: 200; box-shadow: 0 5px 20px rgba(0,0,0,.5); }
#emoji-picker span { font-size: 20px; cursor: pointer; text-align: center; padding: 4px; border-radius: 6px; }
#emoji-picker span:hover { background: #3b0764; }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول والتعديل -->
<div id="login-screen">
<div class="dating-background"></div>
<div class="corner-frame">
<span class="corner top-right"></span>
<span class="corner top-left"></span>
<span class="corner bottom-right"></span>
<span class="corner bottom-left"></span>
</div>
<div class="avatar-container">
<div class="crown-icon">👑</div>
<div class="avatar-circle" onclick="document.getElementById('file-input').click()">
<span class="avatar-placeholder" id="avatar-text">اضغط لاختيار صورتك</span>
<img id="avatar-preview" src="" style="display:none;">
</div>
<input type="file" id="file-input" accept="image/*" onchange="loadLocalImage(event)">
</div>
<div class="input-box-container">
<input type="text" id="username-input" maxlength="9" placeholder="اكتب اسمك هنا">
</div>
<button id="login-btn" onclick="saveAndJoin()">حفظ ودخول الجروب</button>
</div>

<!-- نافذة معلومات الجروب الحقيقية -->
<div id="group-info-modal">
<div class="gi-header">
<button class="gi-back" onclick="closeGroupInfo()">✕</button>
<div style="width: 24px;"></div>
</div>
<div class="gi-top-box">
<img class="gi-big-avatar" src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=900">
<div class="gi-group-name">جروب تعارف ودردشة</div>
<div class="gi-members-count" id="gi-count-text">مجموعة • جاري الحساب...</div>
<div class="gi-desc">
مرحباً بكم في جروب تعارف ودردشة الملكية العريقة. التواصل باحترام وتقدير للجميع.
</div>
<div class="gi-action-buttons">
<div class="gi-action-btn-wrap" onclick="alert('خاصية البحث في الجروب')">
<div class="gi-circle-icon">🔍</div>
<span class="gi-action-label">بحث</span>
</div>
<div class="gi-action-btn-wrap" onclick="alert('الدردشة الصوتية')">
<div class="gi-circle-icon">📞</div>
<span class="gi-action-label">دردشة صوتية</span>
</div>
</div>
</div>

<div class="gi-tabs">
<div class="gi-tab active">الأعضاء الحقيقيون</div>
</div>

<div class="gi-members-section" id="gi-members-container"></div>
</div>

<!-- شاشة المحادثة الأساسية -->
<div id="chat-screen">
<div class="chat-header">
<div class="header-left" onclick="openGroupInfo()">
<img id="header-user-avatar" class="header-avatar">
<div class="chat-header-info">
<h3>جروب تعارف ودردشة</h3>
<span class="online-badge" id="header-online-count">● جاري التحميل...</span>
</div>
</div>
<button class="group-info-btn" onclick="openGroupInfo()" title="معلومات الجروب">✏️</button>
</div>

<div class="chat-messages" id="messages-box"></div>

<div id="action-menu">
<div class="menu-item" onclick="copySelectedText()">📋 نسخ النص</div>
<div class="menu-item" id="edit-menu-btn" onclick="editSelectedMessage()" style="display:none;">✏️ تعديل الرسالة</div>
</div>

<div class="chat-input-area">
<div class="input-wrapper">
<input type="text" id="msg-input" placeholder="اكتب رسالتك..." onkeypress="checkEnter(event)">
<button type="button" class="emoji-btn" onclick="toggleEmojiPicker(event)">😊</button>
</div>
<button class="send-submit" id="send-btn-action" onclick="sendMessage()">➤</button>

<div id="emoji-picker">
<span onclick="addEmoji('😊')">😊</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('😍')">😍</span>
<span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('✨')">✨</span><span onclick="addEmoji('👑')">👑</span><span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('🚀')">🚀</span><span onclick="addEmoji('💬')">💬</span>
</div>
</div>
</div>

<script>
let myName = localStorage.getItem('chat_my_name') || "";
let myAvatar = localStorage.getItem('chat_my_avatar') || "https://i.imgur.com/6VBx3io.png";
let activeMessageId = null;
let activeMessageText = "";
let isEditing = false;
let editTargetId = null;

window.onload = function() {
    if (!myName) {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('chat-screen').style.display = 'none';
    } else {
        document.getElementById('header-user-avatar').src = myAvatar;
        registerPresence();
        fetchData();
        setInterval(fetchData, 3000);
    }
};

function loadLocalImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        myAvatar = e.target.result;
        document.getElementById('avatar-preview').src = myAvatar;
        document.getElementById('avatar-preview').style.display = 'block';
        document.getElementById('avatar-text').style.display = 'none';
    };
    reader.readAsDataURL(file);
}

function saveAndJoin() {
    const nameInput = document.getElementById('username-input').value.trim();
    if (nameInput.length < 3 || nameInput.length >= 10) {
        alert('يجب أن يكون الاسم بين 3 و 9 أحرف');
        return;
    }
    myName = nameInput;
    localStorage.setItem('chat_my_name', myName);
    localStorage.setItem('chat_my_avatar', myAvatar);
    
    registerPresence().then(() => {
        document.getElementById('header-user-avatar').src = myAvatar;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        fetchData();
    });
}

function registerPresence() {
    return fetch('/check-name', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user: myName, avatar: myAvatar})
    }).then(res => res.json());
}

function openGroupInfo() {
    document.getElementById('group-info-modal').style.display = 'flex';
    fetchMembers();
}

function closeGroupInfo() {
    document.getElementById('group-info-modal').style.display = 'none';
}

function fetchData() {
    fetchMessages();
    fetchMembersCount();
}

function fetchMembersCount() {
    fetch('/members')
    .then(res => res.json())
    .then(members => {
        const total = members.length;
        const online = members.filter(m => m.online).length;
        document.getElementById('header-online-count').innerText = `● ${online} متصل (إجمالي: ${total})`;
        document.getElementById('gi-count-text').innerText = `مجموعة • ${total} من الأعضاء (${online} متصل)`;
    });
}

function fetchMembers() {
    fetch('/members')
    .then(res => res.json())
    .then(members => {
        const list = document.getElementById('gi-members-container');
        list.innerHTML = `<div class="gi-section-title">${members.length} عضواً حقيقياً</div>`;
        members.forEach((m, index) => {
            const item = document.createElement('div');
            item.className = 'gi-member-item';
            const isManager = index === 0;
            
            item.innerHTML = `
                <div class="gi-member-info">
                    <img class="gi-member-avatar" src="${m.avatar}">
                    <div>
                        <div class="gi-member-name">${m.username} ${m.username === myName ? '(أنت)' : ''}</div>
                        <div class="gi-member-status">${m.online ? 'متصل الآن' : 'غير متصل'}</div>
                    </div>
                </div>
                ${isManager ? '<span class="gi-role-badge">مشرف المجموعة</span>' : '<span style="font-size: 12px; color: #a78bfa;">عضو</span>'}
            `;
            list.appendChild(item);
        });
    });
}

function toggleEmojiPicker(e) {
    e.stopPropagation();
    const picker = document.getElementById('emoji-picker');
    picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
}

function addEmoji(emoji) {
    const input = document.getElementById('msg-input');
    input.value += emoji;
    input.focus();
    document.getElementById('emoji-picker').style.display = 'none';
}

function checkEnter(e) {
    if (e.key === 'Enter') sendMessage();
}

function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    if (isEditing) {
        fetch('/edit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: editTargetId, text: text, user: myName })
        }).then(() => {
            input.value = '';
            isEditing = false;
            editTargetId = null;
            document.getElementById('send-btn-action').innerText = "➤";
            fetchMessages();
        });
    } else {
        fetch('/send', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user: myName, text: text, avatar: myAvatar })
        }).then(() => {
            input.value = '';
            fetchMessages();
        });
    }
}

function fetchMessages() {
    fetch('/messages')
    .then(res => res.json())
    .then(data => {
        const box = document.getElementById('messages-box');
        box.innerHTML = '';
        data.forEach(msg => {
            const div = document.createElement('div');
            const isMe = msg.user === myName;
            div.className = `message ${isMe ? 'outgoing' : 'incoming'}`;
            const timeStr = new Date(msg.time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const avatar = document.createElement('img');
            avatar.className = 'msg-avatar';
            avatar.src = msg.avatar || 'https://i.imgur.com/6VBx3io.png';
            const content = document.createElement('div');
            content.className = 'msg-content';
            const username = document.createElement('span');
            username.className = 'msg-user';
            username.textContent = msg.user;
            const messageText = document.createElement('div');
            messageText.className = 'msg-text';
            messageText.textContent = msg.text;
            const time = document.createElement('span');
            time.className = 'msg-time';
            time.textContent = timeStr;
            content.append(username, messageText, time);
            div.append(avatar, content);
            div.onclick = (e) => {
                e.stopPropagation();
                showActionInfo(e, msg.id, msg.text, msg.user);
            };
            box.appendChild(div);
        });
    });
}

function showActionInfo(e, id, text, user) {
    const menu = document.getElementById('action-menu');
    activeMessageId = id;
    activeMessageText = text;
    menu.style.display = 'block';
    menu.style.top = `${Math.min(e.clientY, window.innerHeight - 120)}px`;
    menu.style.left = `${Math.min(e.clientX, window.innerWidth - 160)}px`;
    document.getElementById('edit-menu-btn').style.display = user === myName ? 'flex' : 'none';
}

window.onclick = function() {
    document.getElementById('action-menu').style.display = 'none';
    document.getElementById('emoji-picker').style.display = 'none';
};

function copySelectedText() {
    navigator.clipboard.writeText(activeMessageText).then(() => alert('تم نسخ النص بنجاح!'));
}

function editSelectedMessage() {
    isEditing = true;
    editTargetId = activeMessageId;
    const input = document.getElementById('msg-input');
    input.value = activeMessageText;
    input.focus();
    document.getElementById('send-btn-action').innerText = "✔";
}
</script>
</body>
</html>
