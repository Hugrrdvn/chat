<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>جروب تعارف ودردشة</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-user-select: none; }
body { background: #0c0219; height: 100vh; color: white; overflow: hidden; display: flex; justify-content: center; align-items: center; }

/* شاشة تسجيل الدخول الملكية الفخمة */
#login-screen { display: flex; position: fixed; inset: 0; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: auto; flex-direction: column; align-items: center; background: #1a082c; border: 2px solid #581c87; box-shadow: 0 0 40px rgba(168,85,247,.4); z-index: 200; overflow: hidden; }

.corner-frame { position: absolute; inset: 12px; pointer-events: none; z-index: 25; }
.corner { position: absolute; width: 35px; height: 35px; border-color: #c084fc; border-style: solid; }
.top-right { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 10px 0 0; }
.top-left { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 10px 0 0 0; }
.bottom-right { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 10px 0; }
.bottom-left { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 10px; }

.avatar-container { position: absolute; top: 55px; width: 130px; height: 130px; z-index: 10; display: flex; flex-direction: column; align-items: center; }
.crown-icon { font-size: 45px; margin-bottom: -15px; z-index: 15; filter: drop-shadow(0 0 10px #fbbf24); }
.avatar-circle { width: 120px; height: 120px; border-radius: 50%; background: #120524; border: 3px solid #c084fc; display: flex; justify-content: center; align-items: center; overflow: hidden; cursor: pointer; box-shadow: 0 0 25px rgba(192,132,252,0.6); }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.avatar-placeholder { font-size: 12px; color: #e9d5ff; text-align: center; padding: 15px; font-weight: bold; }
#file-input { display: none; }

.input-box-container { position: absolute; top: 44%; left: 8%; width: 84%; background: rgba(30,16,53,0.85); border-radius: 30px; padding: 12px 18px; border: 1px solid #7c3aed; box-shadow: inset 0 2px 8px rgba(192,132,252,0.3); z-index: 10; }
.input-box-container input { width: 100%; background: transparent; border: none; outline: none; color: white; font-size: 18px; text-align: center; font-weight: bold; }
.input-box-container input::placeholder { color: #d8b4fe; opacity: 0.8; }

.dating-background { position: absolute; bottom: 0; left: 0; width: 100%; height: 38%; background-image: linear-gradient(to top, rgba(26,8,44,0.95) 0%, rgba(26,8,44,0.4) 60%, transparent 100%), url('https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=900'); background-size: cover; background-position: center; z-index: 5; pointer-events: none; }

#login-btn { position: absolute; bottom: 40px; left: 15%; width: 70%; background: linear-gradient(135deg, #a855f7, #7c3aed); color: white; border: none; padding: 12px; border-radius: 30px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 20px rgba(168,85,247,0.5); z-index: 30; }

/* نافذة معلومات الجروب */
#group-info-modal { display: none; position: fixed; inset: 0; background: #0c0219; z-index: 150; overflow-y: auto; flex-direction: column; max-width: 540px; margin: auto; padding: 10px; }
.gi-container-box { background: #120524; border-radius: 16px; border: 1px solid #3b0764; overflow: hidden; display: flex; flex-direction: column; }
.gi-header { background: #180b2e; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3b0764; position: sticky; top: 0; z-index: 10; }
.gi-back { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
.gi-top-box { display: flex; flex-direction: column; align-items: center; padding: 25px 15px 20px; background: #120524; text-align: center; border-bottom: 1px solid #3b0764; }
.gi-big-avatar { width: 95px; height: 95px; border-radius: 50%; object-fit: cover; border: 3px solid #c084fc; margin-bottom: 12px; box-shadow: 0 0 20px rgba(192,132,252,0.4); }
.gi-group-name { font-size: 20px; font-weight: bold; color: white; margin-bottom: 4px; }
.gi-members-count { font-size: 13px; color: #a78bfa; margin-bottom: 15px; }
.gi-desc { font-size: 13px; color: #d8b4fe; padding: 0 15px; line-height: 1.4; margin-bottom: 15px; text-align: center; }

.gi-actions-row { display: flex; justify-content: center; gap: 30px; width: 100%; }
.gi-action-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.gi-action-circle { width: 44px; height: 44px; border-radius: 50%; background: #1e1035; border: 1px solid #581c87; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #c084fc; }
.gi-action-text { font-size: 11px; color: #c4b5fd; }

.gi-members-wrapper { background: #ffffff; border-radius: 14px; margin: 12px; padding: 12px; border: 2px solid #ffffff; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
.gi-members-title { font-size: 13px; color: #000000; font-weight: bold; margin-bottom: 10px; padding-right: 5px; }
.gi-member-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #e4e4e7; background: #ffffff; border-radius: 8px; margin-bottom: 6px; }
.gi-member-left { display: flex; align-items: center; gap: 12px; }
.gi-member-av { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
.gi-member-name { font-size: 14px; font-weight: bold; color: #000000; }
.gi-member-sub { font-size: 11px; color: #707579; margin-top: 1px; }
.gi-role-tag { font-size: 11px; color: #7c3aed; background: #f3f0fc; padding: 2px 8px; border-radius: 6px; font-weight: bold; border: 1px solid #d8b4fe; }

/* شاشة المحادثة بتصميم تيليجرام الدقيق 100% */
#chat-screen { display: none; width: 100%; max-width: 540px; height: 100vh; height: 100dvh; background: #0f1b29; flex-direction: column; position: relative; margin: auto; }
.chat-header { background: #17212b; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0e1621; z-index: 10; }
.header-left { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.header-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
.chat-header-info h3 { font-size: 15px; color: #ffffff; font-weight: 600; }
.online-badge { font-size: 11px; color: #788ab6; }
.group-options-btn { background: none; border: none; color: #788ab6; font-size: 20px; cursor: pointer; }

/* خلفية شاشة الدردشة الرسمية لتيليجرام */
.chat-messages { 
    flex: 1; 
    padding: 12px 14px; 
    overflow-y: auto; 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
    background-color: #0e1621;
    background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 20px 20px;
}

/* تصميم رسالة تيليجرام بدقة (صورة بجانب الرسالة، الاسم الملون، والفقاعة) */
.telegram-msg-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 85%;
    margin-bottom: 4px;
}
.telegram-msg-wrapper.my-msg {
    align-self: flex-end;
    flex-direction: row-reverse;
}
.msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    margin-bottom: 2px;
}
.msg-bubble {
    background: #182533;
    padding: 8px 12px;
    border-radius: 12px;
    position: relative;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    color: #ffffff;
    font-size: 14px;
    word-break: break-word;
}
.telegram-msg-wrapper.my-msg .msg-bubble {
    background: #2b5278; /* لون رسائلك الخاص في تيليجرام */
}
.msg-username {
    font-size: 12px;
    font-weight: bold;
    color: #e17055; /* لون اسم المستخدم مثل تيليجرام */
    margin-bottom: 2px;
}
.telegram-msg-wrapper.my-msg .msg-username {
    display: none; /* إخفاء اسمك فوق رسائلك تماماً مثل تيليجرام */
}
.msg-time {
    font-size: 10px;
    color: #899bb1;
    float: left;
    margin-left: 8px;
    margin-top: 4px;
}

/* شريط الإرسال السفلي المطابق لتيليجرام */
.chat-input-area { background: #17212b; padding: 10px 14px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #0e1621; }
.chat-input-area input { flex: 1; padding: 10px 16px; background: #242f3d; border: none; border-radius: 20px; outline: none; font-size: 14px; color: white; }
.chat-input-area input::placeholder { color: #788ab6; }
.chat-input-area button { background: #5288c1; color: white; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

/* نافذة التفاعلات المنبثقة (دائرة بيضاء بأطراف سوداء مظللة) */
.reaction-popup {
    position: absolute;
    background: #ffffff;
    border: 1px solid rgba(0,0,0,0.2);
    border-radius: 30px;
    padding: 6px 12px;
    display: flex;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    z-index: 1000;
    animation: popIn 0.2s ease-out;
}
@keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
.reaction-popup span { font-size: 20px; cursor: pointer; transition: transform 0.2s; }
.reaction-popup span:hover { transform: scale(1.3); }

.message-reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.reaction-badge { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 2px 6px; font-size: 11px; display: flex; align-items: center; gap: 3px; cursor: pointer; color: white; }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="login-screen">
<div class="corner-frame">
<span class="corner top-right"></span>
<span class="corner top-left"></span>
<span class="corner bottom-right"></span>
<span class="corner bottom-left"></span>
</div>

<div class="avatar-container">
<div class="crown-icon">👑</div>
<div class="avatar-circle" onclick="document.getElementById('file-input').click()">
<span class="avatar-placeholder" id="avatar-text">اضغط لاختيار صورتك</span>
<img id="avatar-preview" src="" style="display:none;">
</div>
<input type="file" id="file-input" accept="image/*" onchange="loadLocalImage(event)">
</div>

<div class="input-box-container">
<input type="text" id="username-input" maxlength="9" placeholder="اكتب اسمك هنا...">
</div>

<div class="dating-background"></div>

<button id="login-btn" onclick="saveAndJoin()">تمام</button>
</div>

<!-- نافذة معلومات الجروب -->
<div id="group-info-modal">
<div class="gi-container-box">
<div class="gi-header">
<button class="gi-back" onclick="openChatScreen()">✕</button>
<span style="font-weight: bold; color: white;">معلومات المجموعة</span>
<div style="width: 24px;"></div>
</div>

<div class="gi-top-box">
<img class="gi-big-avatar" src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=900">
<div class="gi-group-name">جروب تعارف ودردشة</div>
<div class="gi-members-count" id="gi-count-text">مجموعة • جاري الحساب...</div>
<div class="gi-desc">مرحباً بكم في جروب تعارف ودردشة الملكية العريقة. التواصل باحترام وتقدير للجميع.</div>

<div class="gi-actions-row">
<div class="gi-action-item" onclick="alert('بحث')">
<div class="gi-action-circle">🔍</div>
<span class="gi-action-text">بحث</span>
</div>
<div class="gi-action-item" onclick="alert('دردشة صوتية')">
<div class="gi-action-circle">📞</div>
<span class="gi-action-text">دردشة صوتية</span>
</div>
</div>
</div>

<div class="gi-members-wrapper">
<div class="gi-members-title" id="gi-title-count">الأعضاء الحقيقيون</div>
<div id="gi-members-container"></div>
</div>

</div>
</div>

<!-- شاشة المحادثة بتصميم تيليجرام الدقيق -->
<div id="chat-screen">
<div class="chat-header">
<div class="header-left" onclick="openGroupInfo()">
<img id="header-user-avatar" class="header-avatar" src="https://i.imgur.com/6VBx3io.png">
<div class="chat-header-info">
<h3>جروب تعارف ودردشة</h3>
<span class="online-badge" id="header-online-count">جاري التحميل...</span>
</div>
</div>
<button class="group-options-btn" onclick="openGroupInfo()">✏️</button>
</div>
<div class="chat-messages" id="messages-box"></div>
<div class="chat-input-area">
<input type="text" id="msg-input" placeholder="الرسالة..." onkeypress="checkEnter(event)">
<button onclick="sendMessage()">➤</button>
</div>
</div>

<script>
let myName = localStorage.getItem('chat_my_name') || "";
let myAvatar = localStorage.getItem('chat_my_avatar') || "https://i.imgur.com/6VBx3io.png";

window.onload = function() {
    if (!myName) {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('group-info-modal').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'none';
    } else {
        document.getElementById('header-user-avatar').src = myAvatar;
        registerPresence();
        openChatScreen();
        fetchMembers();
        fetchMessages();
        setInterval(() => {
            if (myName) {
                fetch('/heartbeat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user: myName})
                });
            }
            fetchMembers();
            fetchMessages();
        }, 3000);
    }
};

function loadLocalImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        myAvatar = e.target.result;
        document.getElementById('avatar-preview').src = myAvatar;
        document.getElementById('avatar-preview').style.display = 'block';
        document.getElementById('avatar-text').style.display = 'none';
    };
    reader.readAsDataURL(file);
}

function saveAndJoin() {
    const nameInput = document.getElementById('username-input').value.trim();
    if (nameInput.length < 3 || nameInput.length >= 10) {
        alert('يجب أن يكون الاسم بين 3 و 9 أحرف');
        return;
    }
    myName = nameInput;
    localStorage.setItem('chat_my_name', myName);
    localStorage.setItem('chat_my_avatar', myAvatar);
    
    registerPresence().then(() => {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('header-user-avatar').src = myAvatar;
        openChatScreen();
        fetchMembers();
        fetchMessages();
    });
}

function registerPresence() {
    return fetch('/check-name', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user: myName, avatar: myAvatar})
    }).then(res => res.json());
}

function openGroupInfo() {
    document.getElementById('group-info-modal').style.display = 'flex';
    document.getElementById('chat-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'none';
    fetchMembers();
}

function openChatScreen() {
    document.getElementById('group-info-modal').style.display = 'none';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
    fetchMessages();
}

function fetchMembers() {
    fetch('/members')
    .then(res => res.json())
    .then(members => {
        const total = members.length;
        const online = members.filter(m => m.online).length;
        document.getElementById('gi-count-text').innerText = `مجموعة • ${total} من الأعضاء (${online} متصل)`;
        document.getElementById('header-online-count').innerText = `● ${online} متصل الآن`;
        document.getElementById('gi-title-count').innerText = `${total} عضواً حقيقياً`;
        
        const list = document.getElementById('gi-members-container');
        list.innerHTML = '';
        members.forEach((m, index) => {
            const item = document.createElement('div');
            item.className = 'gi-member-row';
            const isManager = index === 0;
            
            item.innerHTML = `
                <div class="gi-member-left">
                    <img class="gi-member-av" src="${m.avatar}">
                    <div>
                        <div class="gi-member-name">${m.username} ${m.username === myName ? '(أنت)' : ''}</div>
                        <div class="gi-member-sub" style="color: ${m.online ? '#16a34a' : '#707579'};">${m.online ? 'متصل الآن' : 'غير متصل'}</div>
                    </div>
                </div>
                ${isManager ? '<span class="gi-role-tag">مشرف المجموعة</span>' : '<span style="font-size: 11px; color: #7c3aed; font-weight: bold;">عضو</span>'}
            `;
            list.appendChild(item);
        });
    });
}

function checkEnter(e) {
    if (e.key === 'Enter') sendMessage();
}

function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    fetch('/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user: myName, text: text, avatar: myAvatar })
    }).then(() => {
        input.value = '';
        fetchMessages();
    });
}

function fetchMessages() {
    fetch('/messages')
    .then(res => res.json())
    .then(data => {
        const box = document.getElementById('messages-box');
        box.innerHTML = '';
        data.forEach(msg => {
            const isMe = msg.user === myName;
            const wrapper = document.createElement('div');
            wrapper.className = `telegram-msg-wrapper ${isMe ? 'my-msg' : ''}`;
            wrapper.style.position = "relative";

            // صورة البروفايل بجانب الرسالة تماماً كتيليجرام
            let avatarHTML = '';
            if (!isMe) {
                avatarHTML = `<img class="msg-avatar" src="${msg.avatar}">`;
            }

            let reactionsHTML = '';
            if (msg.reactions && Object.keys(msg.reactions).length > 0) {
                reactionsHTML = '<div class="message-reactions">';
                for (let [user, emoji] of Object.entries(msg.reactions)) {
                    reactionsHTML += `<span class="reaction-badge">${emoji}</span>`;
                }
                reactionsHTML += '</div>';
            }

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            
            // دعم الضغط المطول لإظهار التفاعلات
            let pressTimer;
            bubble.onmousedown = () => pressTimer = setTimeout(() => showReactionPopup(msg.id, bubble), 500);
            bubble.onmouseup = () => clearTimeout(pressTimer);
            bubble.ontouchstart = () => pressTimer = setTimeout(() => showReactionPopup(msg.id, bubble), 500);
            bubble.ontouchend = () => clearTimeout(pressTimer);

            bubble.innerHTML = `
                <div class="msg-username">${msg.user}</div>
                <div>${msg.text}</div>
                <span class="msg-time">${msg.time}</span>
                ${reactionsHTML}
            `;

            wrapper.innerHTML = avatarHTML;
            wrapper.appendChild(bubble);
            box.appendChild(wrapper);
        });
        box.scrollTop = box.scrollHeight;
    });
}

function showReactionPopup(msgId, element) {
    const oldPopup = document.getElementById('active-reaction-popup');
    if (oldPopup) oldPopup.remove();

    const popup = document.createElement('div');
    popup.id = 'active-reaction-popup';
    popup.className = 'reaction-popup';
    
    const emojis = ['👍', '❤️', '🔥', '👏', '😂', '😢'];
    emojis.forEach(emoji => {
        const span = document.createElement('span');
        span.innerText = emoji;
        span.onclick = (e) => {
            e.stopPropagation();
            sendReaction(msgId, emoji);
            popup.remove();
        };
        popup.appendChild(span);
    });

    element.appendChild(popup);

    document.addEventListener('click', function closePopup(e) {
        if (!popup.contains(e.target)) {
            popup.remove();
            document.removeEventListener('click', closePopup);
        }
    }, { once: true });
}

function sendReaction(msgId, emoji) {
    fetch('/react', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id: msgId, emoji: emoji, user: MyName })
    }).then(() => fetchMessages());
}
</script>
</body>
</html>
